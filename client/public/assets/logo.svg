<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="1024" viewBox="0 0 1280 1024" xml:space="preserve">
<desc>Nexus Automotive - David HR Europa</desc>
<defs>
  <linearGradient id="nexusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
    <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
  </linearGradient>
  <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1280" height="1024" fill="transparent"/>

<!-- Main Nexus Symbol - Interconnected Network -->
<g transform="translate(640, 512)">
  <!-- Central Hub Circle -->
  <circle cx="0" cy="0" r="80" fill="url(#nexusGradient)" opacity="0.9"/>
  <circle cx="0" cy="0" r="60" fill="#1f2937" opacity="0.8"/>

  <!-- Outer Connection Points (6 points forming a hexagon) -->
  <!-- Top -->
  <circle cx="0" cy="-200" r="40" fill="url(#nexusGradient)"/>
  <line x1="0" y1="-80" x2="0" y2="-160" stroke="url(#nexusGradient)" stroke-width="8"/>

  <!-- Top Right -->
  <circle cx="173" cy="-100" r="40" fill="url(#nexusGradient)"/>
  <line x1="60" y1="-40" x2="133" y2="-60" stroke="url(#nexusGradient)" stroke-width="8"/>

  <!-- Bottom Right -->
  <circle cx="173" cy="100" r="40" fill="url(#nexusGradient)"/>
  <line x1="60" y1="40" x2="133" y2="60" stroke="url(#nexusGradient)" stroke-width="8"/>

  <!-- Bottom -->
  <circle cx="0" cy="200" r="40" fill="url(#nexusGradient)"/>
  <line x1="0" y1="80" x2="0" y2="160" stroke="url(#nexusGradient)" stroke-width="8"/>

  <!-- Bottom Left -->
  <circle cx="-173" cy="100" r="40" fill="url(#nexusGradient)"/>
  <line x1="-60" y1="40" x2="-133" y2="60" stroke="url(#nexusGradient)" stroke-width="8"/>

  <!-- Top Left -->
  <circle cx="-173" cy="-100" r="40" fill="url(#nexusGradient)"/>
  <line x1="-60" y1="-40" x2="-133" y2="-60" stroke="url(#nexusGradient)" stroke-width="8"/>

  <!-- Cross connections for network effect -->
  <line x1="0" y1="-200" x2="173" y2="-100" stroke="#06b6d4" stroke-width="4" opacity="0.5"/>
  <line x1="173" y1="-100" x2="173" y2="100" stroke="#06b6d4" stroke-width="4" opacity="0.5"/>
  <line x1="173" y1="100" x2="0" y2="200" stroke="#06b6d4" stroke-width="4" opacity="0.5"/>
  <line x1="0" y1="200" x2="-173" y2="100" stroke="#06b6d4" stroke-width="4" opacity="0.5"/>
  <line x1="-173" y1="100" x2="-173" y2="-100" stroke="#06b6d4" stroke-width="4" opacity="0.5"/>
  <line x1="-173" y1="-100" x2="0" y2="-200" stroke="#06b6d4" stroke-width="4" opacity="0.5"/>

  <!-- Inner connection circles -->
  <circle cx="0" cy="0" r="30" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.6"/>
  <circle cx="0" cy="0" r="50" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.4"/>

  <!-- Center accent -->
  <circle cx="0" cy="0" r="20" fill="url(#accentGradient)"/>

  <!-- N letter in center -->
  <text x="0" y="15" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="white" text-anchor="middle">N</text>
</g>

<!-- Company Text -->
<g transform="translate(640, 850)">
  <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#1e40af" text-anchor="middle">NEXUS</text>
  <text x="0" y="70" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="normal" fill="#1f2937" text-anchor="middle">AUTOMOTIVE</text>
</g>

</svg>
